    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;

        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 3rem 2rem;
            max-width: 480px;

            box-shadow: 0 8px 30px rgba(0,0,0,0.1);

        .icono {

            margin-bottom: 1.5rem;
        }
        h1 {
            color: #c0392b;

            margin-bottom: 1rem;
        }
        p {
            color: #495057;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }
        .highlight {
            background: #fff0ee;
            border: 1px solid #f5b8b2;
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 2rem;
            color: #c0392b;
            font-weight: 700;
            font-size: 0.95rem;
        }
        .btn-volver {
            display: inline-block;
            background: #c0392b;
            color: white;
            padding: 12px 28px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            transition: background 0.2s, transform 0.2s;
            margin: 0.5rem;
        }
        .btn-volver:hover {
            background: #a93226;
            transform: translateY(-2px);
        }
        .btn-wa {
            display: inline-block;
            background: #25D366;
            color: white;
            padding: 12px 28px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            transition: background 0.2s, transform 0.2s;
            margin: 0.5rem;
        }
        .btn-wa:hover {
            background: #128C7E;
            transform: translateY(-2px);
        }
        .logo-img {
            width: 70px;
            border-radius: 50%;
            margin-bottom: 1.5rem;
        }

    <div class="card">

            <i class="fas fa-arrow-left"></i> Volver al inicio
        </a>
